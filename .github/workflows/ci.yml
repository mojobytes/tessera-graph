name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude ermya-graph-python --features plain-tcp --locked
      - run: cargo package -p ermya-graph --locked
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install 'maturin>=1.7,<2.0' pytest
      - run: maturin build --locked --out dist --manifest-path crates/ermya-graph-python/Cargo.toml
      - run: python -m pip install dist/*.whl
      - run: python -m pytest crates/ermya-graph-python/tests -q

  python-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -f crates/ermya-graph-python/Dockerfile .
