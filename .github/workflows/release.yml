name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@cargo-audit
      - id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: scripts/check-release.sh

  binaries:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin ermya-graph-server --bin ermya-graph-cli
      - shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/ermya-graph-server" dist/
          cp "target/${{ matrix.target }}/release/ermya-graph-cli" dist/
          cp LICENSE dist/LICENSE-MAP
          cp crates/ermya-graph-server/LICENSE dist/LICENSE-BSL-1.1
          tar -C dist -czf "ermya-graph-community-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: "*.tar.gz"

  python-wheels:
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --manifest-path crates/ermya-graph-python/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  publish-github:
    needs: [validate, binaries, python-wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - run: cargo package -p ermya-graph --locked
      - run: cp target/package/ermya-graph-${{ needs.validate.outputs.version }}.crate dist/
      - id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate when the version is not present
        shell: bash
        run: |
          if cargo info "ermya-graph@${{ needs.validate.outputs.version }}" >/dev/null 2>&1; then
            echo "ermya-graph ${{ needs.validate.outputs.version }} is already published"
          else
            cargo publish -p ermya-graph --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
