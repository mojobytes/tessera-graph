# TesseraGraph Enterprise — Development Docker Compose
# =====================================================
# Usage:
#   docker compose up -d              # Start server
#   docker compose logs -f            # Watch logs
#   docker compose exec graphdb tessera-cli ...  # CLI access
#
# Build (from tessera-ecosystem/ root):
#   docker build -t tesseraio/tessera-graph-enterprise:latest \
#     -f tessera-graph-enterprise/Dockerfile .

services:
  graphdb:
    image: tesseraio/tessera-graph-enterprise:latest
    container_name: tessera-graphdb
    ports:
      - "7687:7687"   # Bolt 4.4
      - "9090:9090"   # Prometheus metrics
    environment:
      - TESSERA_ADMIN_PASSWORD=${TESSERA_ADMIN_PASSWORD:-Admin.123}
      - TESSERA_BIND=0.0.0.0:7687
      - TESSERA_DATA_DIR=/var/lib/tessera/data
      - TESSERA_DEFAULT_TENANT=default
      - TESSERA_MEMORY_LIMIT_MB=512
      - TESSERA_MAX_CONNECTIONS=256
      - TESSERA_METRICS_BIND=0.0.0.0:9090
      - TESSERA_AUDIT_PATH=/var/log/tessera/audit.ndjson
      - TESSERA_AUDIT_ROTATION_MAX_MB=100
      - RUST_LOG=tessera_server=info
    volumes:
      - graphdb-data:/var/lib/tessera/data
      - graphdb-logs:/var/log/tessera
    restart: unless-stopped
    networks:
      - tessera-net

networks:
  tessera-net:
    driver: bridge

volumes:
  graphdb-data:
  graphdb-logs:
