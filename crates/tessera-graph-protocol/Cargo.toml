[package]
name = "tessera-graph-protocol"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
rust-version.workspace = true
description = "Bolt 4.4 wire protocol implementation for tessera-graph."
repository = "https://github.com/mojobytes/tessera-graph"
homepage = "https://tesseradb.io"

[dependencies]
thiserror       = "2"
rustls          = "0.23"
rustls-pemfile  = "2"
tokio           = { version = "1", features = ["io-util"] }
bytes           = "1"

[dev-dependencies]
rcgen    = "0.13"
tempfile = "3"
tokio    = { version = "1", features = ["rt", "macros", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
