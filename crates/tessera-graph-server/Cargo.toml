[package]
name        = "tessera-graph-server"
description = "TCP/WebSocket server binary for tessera-graph-enterprise"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[lib]
name = "tessera_graph_server"
path = "src/lib.rs"

[[bin]]
name = "tessera-graph-server"
path = "src/main.rs"

[dependencies]
tessera-graph-protocol = { workspace = true }
tessera-graph-auth = { workspace = true }
tessera-graph-storage = { workspace = true }
tessera-graph-audit = { workspace = true }
tessera-graph-config = { workspace = true }
tessera-graph-monitor = { workspace = true }
tessera-graph-tenant = { workspace = true }
tessera-graph              = { workspace = true }
tessera-graph-cypher = { workspace = true }
fs2                        = "0.4"
thiserror                  = { workspace = true }
tokio                      = { workspace = true, features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tokio-rustls               = { workspace = true }
serde_json                 = { workspace = true }
tracing                    = "0.1"
tracing-subscriber         = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile    = "3"
rcgen       = "0.13"
tokio-rustls = { workspace = true }

[lints]
workspace = true
