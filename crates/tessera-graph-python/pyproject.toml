[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tessera-graph"
version = "0.13.0"
description = "Python bindings for tessera-graph — embeddable graph database."
requires-python = ">=3.9"
# The bindings expose the MIT-licensed embeddable core.
license = "MIT"
authors = [{ name = "Tessera DB", email = "info@tesseradb.io" }]
keywords = ["graph", "database", "embedded", "property-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
module-name = "tessera_graph"

[tool.pytest.ini_options]
testpaths = ["tests"]
