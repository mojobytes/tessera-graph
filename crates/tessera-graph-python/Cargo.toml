[package]
name = "tessera-graph-python"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
license.workspace      = true
rust-version.workspace = true
description = "Python bindings for tessera-graph — embeddable graph database."
repository = "https://github.com/mojobytes/tessera-graph"

[lib]
name = "tessera_graph"
crate-type = ["cdylib"]

[dependencies]
tessera-graph = { path = "../tessera-graph" }
pyo3 = { version = "0.24", features = ["extension-module", "multiple-pymethods"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
# PyO3 #[pymethods] requires &self even on Copy types and cannot use const fn
trivially_copy_pass_by_ref = "allow"
missing_const_for_fn = "allow"
needless_pass_by_value = "allow"
redundant_pub_crate = "allow"
unused_self = "allow"
significant_drop_tightening = "allow"
