[package]
name        = "tessera-graph-benchmark"
description = "Multi-target benchmark harness for tessera-graph-enterprise"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[features]
memgraph           = ["dep:neo4rs", "dep:tokio", "dep:rustls"]
tessera-bolt       = ["dep:tessera-graph-protocol", "dep:tokio", "dep:rustls", "dep:tokio-rustls"]
integration-tests  = []

[dependencies]
tessera-graph    = { workspace = true, features = ["benchmarks"] }
tessera-graph-cypher = { workspace = true }
tessera-graph-config = { workspace = true }
tessera-graph-storage = { workspace = true }
thiserror        = { workspace = true }

# Memgraph / Bolt target (optional)
neo4rs = { version = "0.8", optional = true }
tokio  = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"], optional = true }

# TesseraGraph Bolt target (optional)
tessera-graph-protocol = { workspace = true, optional = true }
rustls           = { version = "0.23", optional = true }
tokio-rustls     = { version = "0.26", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "write_scenarios"
harness = false

[[bench]]
name    = "traversal_scenarios"
harness = false

[[bench]]
name    = "read_scenarios"
harness = false

[[bench]]
name    = "pathfinding_scenarios"
harness = false

[[bench]]
name    = "mixed_scenarios"
harness = false

[lints]
workspace = true
