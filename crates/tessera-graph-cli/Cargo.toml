[package]
name        = "tessera-graph-cli"
description = "CLI tool for TesseraGraph — connect, query, and import data via Bolt protocol"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[lib]
name = "tessera_graph_cli_lib"
path = "src/lib.rs"

[[bin]]
name = "tessera-graph-cli"
path = "src/main.rs"

[dependencies]
tessera-graph          = { workspace = true }
tessera-graph-protocol = { workspace = true }
tessera-graph-server   = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls     = { workspace = true }
rustls           = "0.23"
rustls-pemfile   = "2"
rustls-native-certs = "0.8"
clap             = { version = "4", features = ["derive", "env"] }
rpassword        = { workspace = true }
rustyline        = "14"
comfy-table      = "7"
csv              = "1"
toml             = "0.8"
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
# Task 14 ciclo 5: euid + hostname for the offline CLI audit actor
# ("cli:{uid}@{hostname}"). `nix` is already in the lock via rustyline;
# enabling user+hostname here just turns on the features we need. Both
# wrappers are safe — satisfies workspace `unsafe_code = forbid`.
nix              = { version = "0.28", features = ["user", "hostname"] }

[dev-dependencies]
tempfile = "3"
tokio    = { workspace = true, features = ["rt", "macros", "io-util"] }
fs2      = { workspace = true }

[lints]
workspace = true
