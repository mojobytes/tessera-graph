[package]
name        = "tessera-server"
description = "TCP/WebSocket server binary for tessera-graph-enterprise"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[lib]
name = "tessera_server"
path = "src/lib.rs"

[[bin]]
name = "tessera-server"
path = "src/main.rs"

[dependencies]
tessera-protocol           = { workspace = true }
tessera-auth               = { workspace = true }
tessera-storage-enterprise = { workspace = true }
tessera-audit              = { workspace = true }
tessera-config             = { workspace = true }
tessera-monitor            = { workspace = true }
tessera-tenant             = { workspace = true }
tessera-graph              = { workspace = true }
tessera-cypher             = { workspace = true }
thiserror                  = { workspace = true }
tokio                      = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tokio-rustls               = "0.26"
serde_json                 = { workspace = true }
tracing                    = "0.1"

[dev-dependencies]
tempfile = "3"
rcgen    = "0.13"

[lints]
workspace = true
