[package]
name        = "tessera-graph-auth"
description = "Authentication, RBAC and LBAC for tessera-graph-enterprise"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[dependencies]
tessera-graph  = { workspace = true }
thiserror      = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
argon2         = "0.5"
rand           = "0.9"
zeroize        = { version = "1", features = ["derive"] }
base64ct       = { version = "1", features = ["std"] }
constant_time_eq = "0.3"
ldap3            = { version = "0.12", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
tokio            = { workspace = true, features = ["rt", "sync"] }
jsonwebtoken     = "9"
tracing          = "0.1"

[dev-dependencies]
tempfile = "3"
tokio    = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
