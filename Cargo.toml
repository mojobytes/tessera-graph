[workspace]
resolver = "3"
members = [
    "crates/ermya-graph",
    "crates/ermya-graph-python",
    "crates/ermya-graph-protocol",
    "crates/ermya-graph-cli",
    "crates/ermya-graph-config",
    "crates/ermya-graph-cypher",
    "crates/ermya-graph-server",
]

[workspace.package]
version      = "0.13.0"
edition      = "2024"
authors      = ["Ermya DB <info@ermya-vector.io>"]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }

[workspace.dependencies]
argon2       = { version = "0.5", default-features = false, features = ["std", "alloc"] }
async-trait  = "0.1"
base64       = { version = "0.22", default-features = false, features = ["std"] }
fs2          = "0.4"
getrandom    = "0.2"
moka         = { version = "0.12", default-features = false, features = ["sync"] }
rpassword    = "7"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = { version = "0.10", default-features = false }
thiserror    = "2"
toml         = { version = "0.8", default-features = false, features = ["parse"] }
time         = { version = "0.3.47", default-features = false, features = ["std", "formatting", "macros"] }
tokio        = { version = "1", default-features = false }
tokio-rustls = { version = "0.26" }
uuid         = { version = "1", features = ["v7"] }
ermya-graph          = { path = "crates/ermya-graph" }
ermya-graph-protocol = { path = "crates/ermya-graph-protocol" }
ermya-graph-config   = { path = "crates/ermya-graph-config" }
ermya-graph-cypher   = { path = "crates/ermya-graph-cypher" }
ermya-graph-server   = { path = "crates/ermya-graph-server" }
