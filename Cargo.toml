[workspace]
resolver = "3"
members = [
    "crates/tessera-graph",
    "crates/tessera-graph-python",
    "crates/tessera-graph-protocol",
    "crates/tessera-graph-cli",
    "crates/tessera-graph-config",
    "crates/tessera-graph-cypher",
    "crates/tessera-graph-server",
]

[workspace.package]
version      = "0.13.0"
edition      = "2024"
authors      = ["Tessera DB <info@tesseradb.io>"]
# Proprietary, all-rights-reserved. There is no OSI/SPDX identifier for a
# closed commercial licence, so this uses the SPDX `LicenseRef-` custom form;
# the full terms live in crates/tessera-graph/LICENSE. NOT an open-source
# licence — production or any other use requires a signed agreement with
# BelowZero Security OU (info@tesseradb.io).
license      = "LicenseRef-TesseraGraph-Proprietary"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }

[workspace.dependencies]
argon2       = { version = "0.5", default-features = false, features = ["std", "alloc"] }
async-trait  = "0.1"
base64       = { version = "0.22", default-features = false, features = ["std"] }
fs2          = "0.4"
getrandom    = "0.2"
moka         = { version = "0.12", default-features = false, features = ["sync"] }
rpassword    = "7"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = { version = "0.10", default-features = false }
thiserror    = "2"
toml         = { version = "0.8", default-features = false, features = ["parse"] }
time         = { version = "0.3", default-features = false, features = ["std", "formatting", "macros"] }
tokio        = { version = "1", default-features = false }
tokio-rustls = { version = "0.26" }
uuid         = { version = "1", features = ["v7"] }
tessera-graph          = { path = "crates/tessera-graph" }
tessera-graph-protocol = { path = "crates/tessera-graph-protocol" }
tessera-graph-config   = { path = "crates/tessera-graph-config" }
tessera-graph-cypher   = { path = "crates/tessera-graph-cypher" }
tessera-graph-server   = { path = "crates/tessera-graph-server" }
