[workspace]
resolver = "2"
members = [
    "crates/tessera-graph-server",
    "crates/tessera-graph-auth",
    "crates/tessera-graph-storage",
    "crates/tessera-graph-import",
    "crates/tessera-graph-streaming",
    "crates/tessera-graph-monitor",
    "crates/tessera-graph-audit",
    "crates/tessera-graph-replication",
    "crates/tessera-graph-tenant",
    "crates/tessera-graph-cypher",
    "crates/tessera-graph-benchmark",
    "crates/tessera-graph-cli",
]

[workspace.package]
version     = "0.3.0"
edition     = "2024"
authors     = ["BelowZero Security OU <info@belowzerosecurity.io>"]
license     = "LicenseRef-Proprietary"
rust-version = "1.85"

[workspace.dependencies]
tessera-graph              = { path = "../tessera-graph/crates/tessera-graph", features = ["extended-gql"] }
tessera-graph-protocol     = { path = "../tessera-graph/crates/tessera-graph-protocol" }
tessera-graph-auth         = { path = "crates/tessera-graph-auth" }
tessera-graph-storage      = { path = "crates/tessera-graph-storage", features = ["extended-gql"] }
tessera-graph-import       = { path = "crates/tessera-graph-import" }
tessera-graph-streaming    = { path = "crates/tessera-graph-streaming" }
tessera-graph-monitor      = { path = "crates/tessera-graph-monitor" }
tessera-graph-audit        = { path = "crates/tessera-graph-audit" }
tessera-graph-config       = { path = "../tessera-graph/crates/tessera-graph-config" }
tessera-graph-cypher       = { path = "crates/tessera-graph-cypher" }
tessera-graph-replication  = { path = "crates/tessera-graph-replication" }
tessera-graph-tenant       = { path = "crates/tessera-graph-tenant" }
tessera-server-core        = { path = "../tessera-graph/crates/tessera-graph-server", package = "tessera-graph-server", features = ["plain-tcp"] }
# default-features = false: each crate must declare the tokio features it needs.
# See: https://doc.rust-lang.org/cargo/reference/features.html#feature-unification
tokio        = { version = "1", default-features = false }
tokio-rustls = { version = "0.26" }
thiserror  = "2"
crc32fast  = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
moka       = { version = "0.12", default-features = false, features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all      = { level = "deny",  priority = -1 }
pedantic = { level = "warn",  priority = -1 }
nursery  = { level = "warn",  priority = -1 }
